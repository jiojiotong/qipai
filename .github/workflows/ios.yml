      - name: Archive（不签名）
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Qipai.xcodeproj \
            -scheme Qipai \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ../build/Qipai.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee ../build.log
          STATUS=${PIPESTATUS[0]}
          grep -E "error:" ../build.log | head -10 | while read -r line; do
            echo "::error::$line"
          done
          exit $STATUS
